name: Hata bildirimi
description: Beklendiği gibi çalışmayan bir davranışı bildirin.
labels: ["type:bug"]
body:
  - type: markdown
    attributes:
      value: "Gerçek öğrenci, personel veya kimlik verisi paylaşmayın; yapay veri kullanın."
  - type: textarea
    id: summary
    attributes:
      label: Ne oldu?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Yeniden üretme adımları
      placeholder: "1. ... 2. ... 3. ..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Beklenen davranış
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Sürüm / commit
  - type: dropdown
    id: sensitive
    attributes:
      label: KVKK veya güvenlik etkisi var mı?
      options: ["Hayır", "Evet", "Emin değilim"]
    validations:
      required: true
